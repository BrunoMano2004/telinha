name: Diagnóstico de cor (Windows)
# Confere preto/branco/vermelho pelo caminho conversão -> encoder do Windows.
on:
  workflow_dispatch:
  push:
    branches: ['diag/**']
permissions:
  contents: read
jobs:
  color:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Testar cores
        shell: pwsh
        run: ./windows/color-test.ps1
