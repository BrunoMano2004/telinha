[package]
name = "telinha"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
glib = { version = "0.22", features = ["v2_74"] }
gstreamer = "0.25.4"
gstreamer-sdp = "0.25.3"
gstreamer-video = "0.25.4"
gstreamer-webrtc = "0.25.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "process", "signal", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "screencast"] }
libc = "0.2.191"
