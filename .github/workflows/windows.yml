name: Instalador Windows
on:
  workflow_dispatch:
  push:
    # Tag v1.2.3 publica uma Release com o instalador (o app avisa quem tem
    # uma versão anterior). Filtros de caminho não valem para tags.
    tags: ['v*']
    paths:
      - 'src/**'
      - 'web/**'
      - 'assets/**'
      - 'windows/**'
      - 'Cargo.*'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'web/**'
      - 'assets/**'
      - 'windows/**'
      - 'Cargo.*'
      - '.github/workflows/windows.yml'
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Rust estavel
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
      - name: Compilar e testar pacote
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Falha ao instalar Inno Setup' }
          }
          ./windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Telinha-Windows-x64
          path: |
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Telinha-Windows-x64
          path: dist
      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          case "$TAG" in
            "v$version"|"v$version"-*) ;;
            *) echo "A tag $TAG não corresponde à versão $version do Cargo.toml"; exit 1 ;;
          esac
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" dist/*.exe dist/*.sha256 --title "Telinha $version" --generate-notes $flags
