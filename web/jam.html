<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telinha · Jam</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
  :root { color-scheme: dark; --accent: #6d5dfc; --line: #2c2c2c; --muted: #9a9a9a; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    font: 13px/1.4 system-ui, sans-serif; color: #e6e6e6; }
  button { background: rgba(30,30,30,.85); color: #e6e6e6; border: 1px solid #3a3a3a;
    border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer; }
  button:hover { background: rgba(60,60,60,.9); }
  button[hidden], input[hidden] { display: none; }

  /* Grade: todas as telas em miniatura. Foco: uma grande e as outras numa faixa. */
  #stage { position: fixed; inset: 0; display: grid; gap: 6px; padding: 6px; box-sizing: border-box;
    grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr));
    grid-auto-rows: minmax(0, 1fr); }
  body.focus #stage { grid-template-columns: minmax(0, 1fr) min(22vw, 300px);
    grid-template-rows: repeat(var(--others, 1), minmax(0, 1fr)); grid-auto-rows: unset; }
  body.focus .tile.selected { grid-column: 1; grid-row: 1 / -1; }
  body.focus .tile:not(.selected) { grid-column: 2; }
  body.solo #stage { grid-template-columns: 1fr; grid-template-rows: 1fr; padding: 0; }
  body.solo .tile:not(.selected) { display: none; }
  body.solo .tile.selected { border-radius: 0; border: 0; }
  @media (max-width: 700px) {
    body.focus #stage { grid-template-columns: repeat(var(--others, 1), minmax(0, 1fr));
      grid-template-rows: minmax(0, 1fr) 22vh; }
    body.focus .tile.selected { grid-column: 1 / -1; grid-row: 1; }
    body.focus .tile:not(.selected) { grid-column: auto; grid-row: 2; }
  }

  .tile { position: relative; min-width: 0; min-height: 0; background: #0b0b0b; border: 1px solid #1d1d1d;
    border-radius: 10px; overflow: hidden; cursor: pointer; }
  .tile:hover { border-color: #3a3a3a; }
  .tile.selected { border-color: var(--accent); cursor: default; }
  .tile video, .tile canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  .tile canvas[hidden], .tile video[hidden] { display: none; }
  .label { position: absolute; left: 8px; bottom: 8px; display: flex; gap: 6px; align-items: center;
    max-width: calc(100% - 16px); padding: 3px 8px; border-radius: 6px; background: rgba(0,0,0,.65);
    font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
  .label .os { color: var(--muted); }
  .label .sound { color: #c9c2ff; }
  .label .key { color: var(--muted); font: 11px ui-monospace, monospace; }
  .state { position: absolute; inset: 0; display: grid; place-items: center; padding: 12px; text-align: center;
    color: var(--muted); font-size: 13px; pointer-events: none; }
  .state:empty { display: none; }
  .tstats { position: absolute; top: 8px; left: 8px; padding: 6px 8px; border-radius: 6px; background: rgba(0,0,0,.7);
    white-space: pre; font: 11px/1.45 ui-monospace, monospace; display: none; pointer-events: none; }
  body.stats .tstats { display: block; }
  body.solo .tile.selected .label { opacity: 0; transition: opacity .3s; }
  body.solo:hover .tile.selected .label { opacity: 1; }

  #empty { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
  #empty[hidden] { display: none; }
  #empty code { display: inline-block; margin-top: 8px; padding: 6px 10px; border-radius: 6px; background: #161616;
    border: 1px solid var(--line); color: #ddd; user-select: all; word-break: break-all; }

  #bar { position: fixed; top: 12px; right: 12px; display: flex; align-items: center; gap: 6px; opacity: 0;
    transition: opacity .2s; z-index: 2; }
  body:hover #bar, body.grid #bar { opacity: 1; }
  #volume { width: 110px; accent-color: var(--accent); cursor: pointer; }
  #hint { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); padding: 6px 12px; border-radius: 8px;
    background: rgba(20,20,20,.9); border: 1px solid var(--line); color: #bbb; font-size: 12px; z-index: 2;
    pointer-events: none; transition: opacity .4s; }
  #hint.off { opacity: 0; }

  .overlay { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(0,0,0,.82); z-index: 3; }
  .overlay[hidden] { display: none; }
  .card { width: min(360px, 100%); box-sizing: border-box; background: #161616; border: 1px solid var(--line);
    border-radius: 14px; padding: 22px; display: grid; gap: 12px; text-align: center; }
  .card img { width: 56px; height: 56px; margin: 0 auto; }
  .card h1 { margin: 0; font-size: 18px; font-weight: 600; }
  .card p { margin: 0; color: #a8a8a8; font-size: 14px; }
  .card input { box-sizing: border-box; width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid #3a3a3a; background: #0d0d0d; color: #eee; font: 15px system-ui, sans-serif; }
  .card input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .card button { padding: 10px; font-size: 15px; background: var(--accent); border: 0; color: #fff; }
  .card button:hover { background: #5a4ae6; }
</style>
</head>
<body class="grid">
<div id="stage"></div>
<div id="empty" hidden>
  <div>
    <p>Ninguém está compartilhando a tela ainda.</p>
    <p>Quem tiver o telinha entra na jam com:</p>
    <code id="join-cmd"></code>
  </div>
</div>
<div id="bar">
  <button id="btn-grid" title="Voltar para a grade (G ou Esc)" hidden>Grade</button>
  <button id="btn-solo" title="Mostrar só esta tela e parar de receber as outras (V)" hidden>Ver só esta</button>
  <button id="btn-sound" title="Som da tela selecionada (M)" hidden>Ativar som</button>
  <input id="volume" type="range" min="0" max="1" step="0.05" title="Volume (↑/↓)" aria-label="Volume" hidden>
  <button id="btn-stats" title="Estatísticas (S)">Estatísticas</button>
  <button id="btn-full" title="Tela cheia (F)">Tela cheia</button>
</div>
<div id="hint" class="off"></div>
<form id="join" class="overlay">
  <div class="card">
    <img src="/favicon.svg" alt="">
    <h1>Jam</h1>
    <p>Como você quer aparecer para o pessoal da jam?</p>
    <input id="name" maxlength="40" placeholder="Seu nome" autocomplete="nickname" autofocus>
    <button type="submit">Entrar</button>
  </div>
</form>
<div id="ended" class="overlay" hidden>
  <div class="card">
    <img src="/favicon.svg" alt="">
    <p id="ended-text"></p>
    <button id="rejoin" type="button">Entrar de novo</button>
  </div>
</div>
<script src="/common.js"></script>
<script>
// Página da jam: uma conexão WebRTC por tela assistida, sinalizada pela sala
// (o WebSocket com o anfitrião). Na grade cada tela vem em miniatura e sem som;
// a tela selecionada vem na qualidade cheia e é a única com som.
const stage = document.getElementById('stage');
const soundBtn = document.getElementById('btn-sound');
const volumeEl = document.getElementById('volume');
const hintEl = document.getElementById('hint');
const params = new URLSearchParams(location.search);
// Página aberta pelo próprio telinha: não mostra a própria tela e começa muda
// (o som desta página voltaria para a transmissão dele).
const localClient = params.get('local') || '';
const forceRelay = params.has('relay');
const remote = location.protocol === 'https:';
const CONNECT_TIMEOUT_MS = 20000;

let ws = null, me = null, viewerName = '', audioCtx = null, stopped = false, nextSid = 1;
let presenters = [];
const tiles = new Map();     // id da tela → tile
const sessions = new Map();  // sid → conexão
// Seleção pelo `client` de quem compartilha: continua valendo se a pessoa reconectar.
let view = { mode: 'grid', client: null };
let userMuted = localClient !== '';
let volume = Math.min(1, Number(stored('telinha-volume', '1')) || 1);

function send(msg) { if (ws?.readyState === 1) ws.send(JSON.stringify(msg)); }
function log(text) { send({ type: 'log', text: String(text).slice(0, 500) }); }

let hintTimer;
function hint(text, ms = 3500) {
  hintEl.textContent = text;
  hintEl.classList.remove('off');
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => hintEl.classList.add('off'), ms);
}

// --- Sala ------------------------------------------------------------------------

function connectRoom() {
  ws = new WebSocket(`${remote ? 'wss' : 'ws'}://${location.host}/ws${location.search}`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => send({ type: 'hello', name: viewerName, device: deviceName(), client: clientId });
  ws.onmessage = (e) => {
    if (typeof e.data !== 'string') return onMedia(e.data);
    const msg = JSON.parse(e.data);
    switch (msg.type) {
      case 'room': return onRoom(msg);
      case 'signal': return sessions.get(msg.sid)?.onSignal(msg.payload);
      case 'closed': return sessions.get(msg.sid)?.onClosed(msg.reason || '');
      case 'ended': return end('A jam terminou.', false);
      case 'kicked': return end('Você foi removido da jam.', true);
      case 'blocked': return end('O anfitrião bloqueou você.', false);
      case 'full': return end('A jam está cheia.', true);
      case 'locked': return end('A jam está trancada: ninguém novo entra agora.', true);
    }
  };
  ws.onclose = () => {
    // As sessões dependem da sala: todas recomeçam quando ela voltar.
    for (const conn of [...sessions.values()]) conn.close(false);
    for (const tile of tiles.values()) {
      clearTimeout(tile.retryTimer);
      tile.retryTimer = null;
      tile.conn = tile.pending = null;
    }
    if (stopped) return;
    for (const tile of tiles.values()) tile.setState('Reconectando com a jam…');
    setTimeout(() => { if (!stopped) connectRoom(); }, 2000);
  };
}

function end(text, canRejoin) {
  stopped = true;
  for (const conn of [...sessions.values()]) conn.close(false);
  if (ws) { ws.onclose = null; try { ws.close(); } catch {} }
  for (const tile of tiles.values()) tile.remove();
  tiles.clear();
  document.getElementById('ended-text').textContent = text;
  document.getElementById('rejoin').hidden = !canRejoin;
  document.getElementById('ended').hidden = false;
}

function onRoom(msg) {
  me = msg.you;
  presenters = msg.presenters.filter((p) => p.sharing && !(localClient && p.client === localClient));
  const ids = new Set(presenters.map((p) => p.id));
  for (const [id, tile] of tiles) {
    if (!ids.has(id)) { tile.remove(); tiles.delete(id); }
  }
  for (const p of presenters) {
    const tile = tiles.get(p.id) || new Tile(p);
    tiles.set(p.id, tile);
    tile.update(p);
  }
  // A tela selecionada saiu: volta para a grade.
  if (view.client && !presenters.some((p) => p.client === view.client)) {
    if (view.mode !== 'grid') hint('A tela que você estava vendo saiu da jam.');
    view = { mode: 'grid', client: null };
  }
  render();
}

// Relé: [sid u32][tipo][pts µs u64][dados].
function onMedia(buffer) {
  const v = new DataView(buffer);
  const conn = sessions.get(v.getUint32(0));
  conn?.player?.feed(v.getUint8(4), Number(v.getBigUint64(5)), new Uint8Array(buffer, 13), buffer.byteLength);
}

// --- Telas ---------------------------------------------------------------------

class Tile {
  constructor(p) {
    this.p = p;
    this.conn = null;      // conexão mostrando imagem agora
    this.pending = null;   // conexão nova (outra camada) ainda conectando
    this.failures = 0;
    this.relay = forceRelay;
    this.retryTimer = null;
    this.el = document.createElement('div');
    this.el.className = 'tile';
    this.el.innerHTML = '<video autoplay playsinline muted></video><canvas hidden></canvas>' +
      '<div class="state"></div><div class="tstats"></div>' +
      '<div class="label"><span class="key"></span><span class="name"></span><span class="os"></span><span class="sound" hidden>🔊</span></div>';
    this.video = this.el.querySelector('video');
    this.canvas = this.el.querySelector('canvas');
    this.stateEl = this.el.querySelector('.state');
    this.statsEl = this.el.querySelector('.tstats');
    this.el.onclick = () => select(this.p.client, view.mode === 'solo' ? 'solo' : 'focus');
    this.el.ondblclick = (e) => { e.stopPropagation(); select(this.p.client, 'solo'); toggleFull(true); };
    this.setState('Conectando…');
    stage.appendChild(this.el);
  }

  update(p) {
    this.p = p;
    this.el.querySelector('.name').textContent = p.name + (p.host ? ' · anfitrião' : '');
    this.el.querySelector('.os').textContent = p.os === 'windows' ? 'Windows' : 'Linux';
  }

  setState(text) { this.stateEl.textContent = text; }

  // Camada que esta tela deve receber agora (null = nenhuma).
  wanted() {
    const selected = view.client === this.p.client;
    if (view.mode === 'grid') return 'low';
    if (selected) return 'high';
    return view.mode === 'solo' ? null : 'low';
  }

  sync() {
    const layer = this.wanted();
    this.el.classList.toggle('selected', view.mode !== 'grid' && view.client === this.p.client);
    if (!layer) {
      clearTimeout(this.retryTimer);
      this.pending?.close(true);
      this.conn?.close(true);
      this.pending = this.conn = null;
      return;
    }
    if (this.conn?.layer === layer) {
      if (this.pending) { this.pending.close(true); this.pending = null; }
    } else if (this.pending?.layer !== layer && !this.retryTimer) {
      this.pending?.close(true);
      this.pending = new Conn(this, layer, this.relay);
    }
    applySound();
  }

  // A conexão nova mostrou imagem: assume o lugar da anterior.
  promote(conn) {
    if (conn !== this.pending) return;
    const old = this.conn;
    this.conn = conn;
    this.pending = null;
    this.failures = 0;
    this.setState('');
    if (conn.player) {
      this.video.hidden = true;
      this.canvas.hidden = false;
    } else {
      this.video.srcObject = conn.stream;
      this.video.hidden = false;
      this.canvas.hidden = true;
      this.video.play().catch(() => {});
    }
    old?.close(true);
    applySound();
  }

  // Uma conexão não vingou (ou caiu): tenta de novo, pelo relé depois de 2 falhas.
  failed(conn, reason) {
    const wasShowing = conn === this.conn;
    if (conn === this.pending) this.pending = null;
    if (wasShowing) this.conn = null;
    if (reason === 'pausada' || reason === 'saiu da jam') return;
    this.failures++;
    if (!this.relay && this.failures >= 2 && remote && tunnelSupported()) {
      this.relay = true;
      log(`tela #${this.p.id}: sem conexão direta, passando para o relé`);
    }
    if (!this.conn) this.setState(this.failures >= 2 && !this.relay
      ? 'Não foi possível ligar o vídeo direto com esta pessoa (a rede de um dos lados bloqueia). Tentando de novo…'
      : reason ? `Sem vídeo (${reason}). Tentando de novo…` : 'Reconectando…');
    clearTimeout(this.retryTimer);
    this.retryTimer = setTimeout(() => { this.retryTimer = null; if (tiles.get(this.p.id) === this) this.sync(); }, 2000);
  }

  remove() {
    clearTimeout(this.retryTimer);
    this.pending?.close(true);
    this.conn?.close(true);
    this.el.remove();
  }
}

// Uma sessão com uma tela, numa camada: WebRTC direto ou relé pela sala.
class Conn {
  constructor(tile, layer, relay) {
    this.tile = tile;
    this.layer = layer;
    this.relay = relay;
    this.sid = nextSid++;
    this.done = false;
    this.stream = null;
    this.player = null;
    this.pc = null;
    sessions.set(this.sid, this);
    this.timer = setTimeout(() => this.fail('tempo esgotado'), CONNECT_TIMEOUT_MS);
    if (relay) {
      this.player = new RelayPlayer(tile.canvas, audioCtx, {
        onFrame: (first) => { if (first) { clearTimeout(this.timer); tile.promote(this); } },
        requestKey: () => send({ type: 'keyframe', sid: this.sid }),
        log,
      });
      this.player.ready.then(() => {
        if (!this.done) send({ type: 'watch', sid: this.sid, pub: tile.p.id, layer, mode: 'relay' });
      });
      return;
    }
    const pc = this.pc = new RTCPeerConnection({
      bundlePolicy: 'max-bundle',
      iceServers: remote ? [{ urls: 'stun:stun.l.google.com:19302' }] : [],
    });
    pc.ontrack = (e) => {
      try { e.receiver.jitterBufferTarget = 0; } catch {}
      try { e.receiver.playoutDelayHint = 0; } catch {}
    };
    pc.onicecandidate = (e) => {
      if (e.candidate) this.signal({ type: 'ice', candidate: e.candidate.candidate, sdpMLineIndex: e.candidate.sdpMLineIndex ?? 0 });
    };
    pc.onconnectionstatechange = () => {
      if (pc.connectionState === 'connected') {
        clearTimeout(this.timer);
        this.stream = new MediaStream(pc.getReceivers().map((r) => r.track));
        tile.promote(this);
      } else if (pc.connectionState === 'failed') {
        this.fail('a conexão falhou');
      }
    };
    send({ type: 'watch', sid: this.sid, pub: tile.p.id, layer, mode: 'webrtc' });
  }

  signal(payload) { send({ type: 'signal', sid: this.sid, payload }); }

  async onSignal(msg) {
    if (!this.pc || this.done) return;
    if (msg.type === 'offer') {
      try {
        await this.pc.setRemoteDescription({ type: 'offer', sdp: msg.sdp });
        const answer = await this.pc.createAnswer();
        await this.pc.setLocalDescription(answer);
        this.signal({ type: 'answer', sdp: answer.sdp });
      } catch (err) {
        log(`tela #${this.tile.p.id}: erro na negociação: ${err.name}: ${err.message}`);
        this.fail('erro na negociação');
      }
    } else if (msg.type === 'ice' && msg.candidate) {
      try { await this.pc.addIceCandidate({ candidate: msg.candidate, sdpMLineIndex: msg.sdpMLineIndex }); } catch {}
    }
  }

  onClosed(reason) {
    if (this.done) return;
    this.close(false);
    this.tile.failed(this, reason);
  }

  fail(reason) {
    if (this.done) return;
    if (this.pc) log(`tela #${this.tile.p.id}: sem vídeo (${reason}) · ICE ${this.pc.iceConnectionState}`);
    this.close(true);
    this.tile.failed(this, reason);
  }

  // `tell`: avisa a sala (quando quem fecha somos nós).
  close(tell) {
    if (this.done) return;
    this.done = true;
    clearTimeout(this.timer);
    sessions.delete(this.sid);
    if (tell) send({ type: 'unwatch', sid: this.sid });
    try { this.pc?.close(); } catch {}
    this.player?.close();
  }
}

// --- Seleção, layout e som -------------------------------------------------------

function select(client, mode) {
  if (view.mode === mode && view.client === client) return;
  view = { mode, client };
  // O clique conta como gesto: a partir daqui o navegador deixa tocar som.
  audioCtx?.resume();
  render();
}

function render() {
  const n = tiles.size;
  document.getElementById('empty').hidden = n > 0;
  const mode = n === 0 ? 'grid' : view.mode;
  document.body.classList.toggle('grid', mode === 'grid');
  document.body.classList.toggle('focus', mode === 'focus');
  document.body.classList.toggle('solo', mode === 'solo');
  // Grade o mais quadrada possível; no foco, as outras telas empilhadas ao lado.
  stage.style.setProperty('--cols', String(Math.max(1, Math.ceil(Math.sqrt(n)))));
  stage.style.setProperty('--others', String(Math.max(1, n - 1)));
  let i = 0;
  for (const tile of tiles.values()) {
    tile.el.querySelector('.key').textContent = ++i <= 9 ? String(i) : '';
    tile.sync();
  }
  document.getElementById('btn-grid').hidden = mode === 'grid';
  const solo = document.getElementById('btn-solo');
  solo.hidden = mode === 'grid';
  solo.textContent = mode === 'solo' ? 'Mostrar todas' : 'Ver só esta';
  applySound();
}

// Só a tela selecionada toca som; na grade, nenhuma.
function applySound() {
  const selected = view.mode !== 'grid' ? [...tiles.values()].find((t) => t.p.client === view.client) : null;
  const hasAudio = !!selected?.p.audio;
  for (const tile of tiles.values()) {
    const on = tile === selected && !userMuted;
    tile.video.muted = !on;
    tile.video.volume = volume;
    tile.conn?.player?.setVolume(on ? volume : 0);
    tile.el.querySelector('.sound').hidden = !(tile === selected && hasAudio && !userMuted);
    if (on && !tile.video.hidden) tile.video.play().catch(() => {});
  }
  soundBtn.hidden = !hasAudio;
  volumeEl.hidden = !hasAudio;
  soundBtn.textContent = userMuted ? 'Ativar som' : 'Silenciar';
  volumeEl.value = userMuted ? 0 : volume;
}

function toggleSound() {
  if (soundBtn.hidden) return;
  userMuted = !userMuted;
  if (!userMuted && localClient) hint('Cuidado: você também compartilha som; o som desta página pode voltar para a jam.', 5000);
  if (!userMuted && volume === 0) volume = 0.5;
  audioCtx?.resume();
  applySound();
}

function setVolume(v) {
  volume = Math.min(1, Math.max(0, Math.round(v * 100) / 100));
  userMuted = volume === 0;
  if (volume > 0) store('telinha-volume', String(volume));
  applySound();
}
volumeEl.oninput = () => setVolume(Number(volumeEl.value));

// --- Estatísticas ---------------------------------------------------------------

let statsTimer;
const lastBytes = new Map();
async function updateStats() {
  for (const tile of tiles.values()) {
    const conn = tile.conn;
    if (!conn) { tile.statsEl.textContent = 'sem vídeo'; continue; }
    const now = performance.now();
    const prev = lastBytes.get(conn);
    const layer = conn.layer === 'high' ? 'alta' : 'miniatura';
    if (conn.player) {
      const p = conn.player;
      const kbps = prev ? ((p.bytes - prev.bytes) * 8 / (now - prev.t)).toFixed(0) : '–';
      const fps = prev ? ((p.frames - prev.frames) * 1000 / (now - prev.t)).toFixed(0) : '–';
      lastBytes.set(conn, { bytes: p.bytes, frames: p.frames, t: now });
      tile.statsEl.textContent = `${layer} · relé\n${tile.canvas.width}x${tile.canvas.height} @ ${fps} fps\n${kbps} kbps · pulados ${p.skipped}`;
      continue;
    }
    let v, pair;
    (await conn.pc.getStats()).forEach((s) => {
      if (s.type === 'inbound-rtp' && s.kind === 'video') v = s;
      if (s.type === 'candidate-pair' && s.nominated && s.state === 'succeeded') pair = s;
    });
    if (!v) continue;
    const kbps = prev ? ((v.bytesReceived - prev.bytes) * 8 / (now - prev.t)).toFixed(0) : '–';
    lastBytes.set(conn, { bytes: v.bytesReceived, t: now });
    const rtt = pair?.currentRoundTripTime != null ? (pair.currentRoundTripTime * 1000).toFixed(0) : '–';
    tile.statsEl.textContent =
      `${layer} · direto\n${v.frameWidth ?? '–'}x${v.frameHeight ?? '–'} @ ${v.framesPerSecond ?? 0} fps\n` +
      `${kbps} kbps · RTT ${rtt} ms\nperdidos ${v.packetsLost ?? 0}`;
  }
}
function toggleStats() {
  document.body.classList.toggle('stats');
  clearInterval(statsTimer);
  if (document.body.classList.contains('stats')) { updateStats(); statsTimer = setInterval(updateStats, 1000); }
}
function toggleFull(on) {
  if (on === true && document.fullscreenElement) return;
  document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});
}

// --- Controles ----------------------------------------------------------------

document.getElementById('btn-grid').onclick = () => select(null, 'grid');
document.getElementById('btn-solo').onclick = () => select(view.client, view.mode === 'solo' ? 'focus' : 'solo');
soundBtn.onclick = toggleSound;
document.getElementById('btn-stats').onclick = toggleStats;
document.getElementById('btn-full').onclick = () => toggleFull();
document.onkeydown = (e) => {
  if (e.target instanceof HTMLInputElement && e.target.type !== 'range') return;
  if (!document.getElementById('join').hidden) return;
  const k = e.key;
  if (k >= '1' && k <= '9') {
    const tile = [...tiles.values()][Number(k) - 1];
    if (tile) select(tile.p.client, view.mode === 'solo' ? 'solo' : 'focus');
  } else if (k === 'Escape' || k === 'g' || k === 'G') {
    if (k === 'Escape' && document.fullscreenElement) return;
    select(null, 'grid');
  } else if ((k === 'v' || k === 'V') && view.mode !== 'grid') {
    select(view.client, view.mode === 'solo' ? 'focus' : 'solo');
  } else if (k === 's' || k === 'S') toggleStats();
  else if (k === 'f' || k === 'F') toggleFull();
  else if (k === 'm' || k === 'M') toggleSound();
  else if ((k === 'ArrowUp' || k === 'ArrowDown') && e.target !== volumeEl && !soundBtn.hidden) {
    e.preventDefault();
    setVolume((userMuted ? 0 : volume) + (k === 'ArrowUp' ? 0.1 : -0.1));
  }
};

// Comando para entrar compartilhando: o link sem os parâmetros desta página.
(() => {
  const link = new URL(location.href);
  for (const key of ['local', 'relay', 'codec']) link.searchParams.delete(key);
  document.getElementById('join-cmd').textContent = `telinha --join "${link.toString()}"`;
})();

const nameInput = document.getElementById('name');
nameInput.value = stored('telinha-name', '');
document.getElementById('join').onsubmit = (e) => {
  e.preventDefault();
  viewerName = nameInput.value.trim();
  store('telinha-name', viewerName);
  document.getElementById('join').hidden = true;
  // Criado no clique: o navegador só deixa tocar som depois de um gesto (relé).
  try { audioCtx = new AudioContext({ latencyHint: 'interactive' }); } catch {}
  if (localClient) hint('Esta é a sua página da jam: a sua tela fica de fora e o som começa desligado.', 6000);
  else hint('Clique numa tela para vê-la grande e ouvir o som dela.', 5000);
  connectRoom();
};
document.getElementById('rejoin').onclick = () => {
  document.getElementById('ended').hidden = true;
  stopped = false;
  audioCtx?.resume();
  connectRoom();
};
</script>
</body>
