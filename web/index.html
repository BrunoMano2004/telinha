<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telinha</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    font: 13px/1.4 system-ui, sans-serif; color: #e6e6e6; }
  video { width: 100vw; height: 100vh; object-fit: contain; display: block; background: #000; }
  #status { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none;
    font-size: 15px; color: #9a9a9a; }
  #status:empty { display: none; }
  #bar { position: fixed; top: 12px; right: 12px; display: flex; gap: 6px; opacity: 0;
    transition: opacity .2s; }
  body:hover #bar, body.idle-off #bar, body.needs-unmute #bar { opacity: 1; }
  button { background: rgba(30,30,30,.85); color: #e6e6e6; border: 1px solid #3a3a3a;
    border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer; }
  button:hover { background: rgba(60,60,60,.9); }
  #stats { position: fixed; top: 12px; left: 12px; background: rgba(0,0,0,.7);
    border: 1px solid #333; border-radius: 6px; padding: 8px 10px; white-space: pre;
    font: 12px/1.5 ui-monospace, monospace; display: none; }
  #stats.on { display: block; }
  .overlay { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px;
    background: rgba(0,0,0,.82); }
  .overlay[hidden] { display: none; }
  .card { width: min(360px, 100%); box-sizing: border-box; background: #161616; border: 1px solid #2c2c2c;
    border-radius: 14px; padding: 22px; display: grid; gap: 12px; text-align: center; }
  .card img { width: 56px; height: 56px; margin: 0 auto; }
  .card h1 { margin: 0; font-size: 18px; font-weight: 600; }
  .card p { margin: 0; color: #a8a8a8; font-size: 14px; }
  .card input { box-sizing: border-box; width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid #3a3a3a; background: #0d0d0d; color: #eee; font: 15px system-ui, sans-serif; }
  .card input:focus { outline: 2px solid #6d5dfc; border-color: transparent; }
  .card button { padding: 10px; font-size: 15px; background: #6d5dfc; border: 0; color: #fff; }
  .card button:hover { background: #5a4ae6; }
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<div id="status"></div>
<pre id="stats"></pre>
<form id="join" class="overlay">
  <div class="card">
    <img src="/favicon.svg" alt="">
    <h1>Telinha</h1>
    <p>Como você quer aparecer para quem está transmitindo?</p>
    <input id="name" maxlength="40" placeholder="Seu nome" autocomplete="nickname" autofocus>
    <button type="submit">Assistir</button>
  </div>
</form>
<div id="ended" class="overlay" hidden>
  <div class="card">
    <img src="/favicon.svg" alt="">
    <p id="ended-text"></p>
    <button id="rejoin" type="button">Entrar de novo</button>
  </div>
</div>
<div id="bar">
  <button id="btn-sound" title="Som (M)" hidden>Ativar som</button>
  <button id="btn-stats" title="Estatísticas (S)">Estatísticas</button>
  <button id="btn-full" title="Tela cheia (F ou duplo clique)">Tela cheia</button>
</div>
<script>
const video = document.getElementById('video');
const statusEl = document.getElementById('status');
const statsEl = document.getElementById('stats');
const soundBtn = document.getElementById('btn-sound');
// Conexão que está mostrando vídeo agora (a nova só a substitui ao conectar).
let activePc, statsTimer, last;

function setStatus(text) { statusEl.textContent = text; }

// localStorage pode não existir (janela anônima, armazenamento bloqueado).
function stored(key, fallback) {
  try { return localStorage.getItem(key) ?? fallback; } catch { return fallback; }
}
function store(key, value) {
  try { localStorage.setItem(key, value); } catch {}
}
// Id aleatório deste navegador: permite que quem transmite bloqueie alguém.
const clientId = (() => {
  let id = stored('telinha-client', '');
  if (!id) {
    id = (crypto.randomUUID?.() ?? Math.random().toString(36).slice(2) + Date.now().toString(36));
    store('telinha-client', id);
  }
  return id;
})();
// O navegador não revela o nome do computador; mostramos navegador · sistema.
function deviceName() {
  const ua = navigator.userAgent;
  const browser = /Edg\//.test(ua) ? 'Edge' : /OPR\//.test(ua) ? 'Opera' : /Firefox\//.test(ua) ? 'Firefox'
    : /Chrome\//.test(ua) ? 'Chrome' : /Safari\//.test(ua) ? 'Safari' : 'Navegador';
  const os = /Android/.test(ua) ? 'Android' : /iPhone|iPad/.test(ua) ? 'iOS' : /Windows/.test(ua) ? 'Windows'
    : /Mac OS X/.test(ua) ? 'macOS' : /CrOS/.test(ua) ? 'ChromeOS' : /Linux/.test(ua) ? 'Linux' : '';
  return os ? `${browser} · ${os}` : browser;
}
let viewerName = '';

// Expulso ou bloqueado: para de reconectar e mostra o aviso.
function ended(text, canRejoin) {
  if (activePc) { activePc.close(); activePc = null; }
  video.srcObject = null;
  setStatus('');
  document.getElementById('ended-text').textContent = text;
  document.getElementById('rejoin').hidden = !canRejoin;
  document.getElementById('ended').hidden = false;
}

// Tempo máximo para uma tentativa chegar ao vídeo; depois disso, recomeça do zero.
const CONNECT_TIMEOUT_MS = 20000;

function connect() {
  // Variáveis locais: handlers de uma tentativa antiga nunca mexem na nova.
  const prevPc = activePc;
  let done = false;
  // HTTPS = aberto pelo túnel da Cloudflare, de fora da tailnet: precisa de STUN
  // para o vídeo achar um caminho até a máquina que transmite.
  const remote = location.protocol === 'https:';
  const ws = new WebSocket(`${remote ? 'wss' : 'ws'}://${location.host}/ws${location.search}`);
  const pc = new RTCPeerConnection({
    bundlePolicy: 'max-bundle',
    iceServers: remote ? [{ urls: 'stun:stun.l.google.com:19302' }] : [],
  });
  if (!prevPc) setStatus('Conectando…');
  ws.onopen = () => ws.send(JSON.stringify({ type: 'hello', name: viewerName, device: deviceName(), client: clientId }));
  // Fim definitivo (sem nova tentativa).
  const stop = (text, canRejoin) => {
    done = true;
    clearTimeout(timer);
    ws.onclose = null;
    try { ws.close(); } catch {}
    pc.close();
    ended(text, canRejoin);
  };
  // Diagnóstico: o que acontece no navegador aparece no terminal de quem transmite.
  const log = (text) => {
    if (ws.readyState === 1) ws.send(JSON.stringify({ type: 'log', text: String(text).slice(0, 500) }));
  };

  // Encerra esta tentativa (uma vez só) e agenda a próxima.
  const retry = (text, delay = 2000) => {
    if (done) return;
    done = true;
    clearTimeout(timer);
    ws.onclose = null;
    try { ws.close(); } catch {}
    // A conexão em uso fica aberta: mantém a última imagem até a próxima conectar.
    if (pc !== activePc) pc.close();
    setStatus(text);
    setTimeout(connect, delay);
  };
  const timer = setTimeout(() => retry('Reconectando…', 0), CONNECT_TIMEOUT_MS);

  pc.ontrack = (e) => {
    // Pede ao navegador o menor buffer de reprodução possível.
    try { e.receiver.jitterBufferTarget = 0; } catch {}
    try { e.receiver.playoutDelayHint = 0; } catch {}
    if (e.track.kind === 'audio') {
      soundBtn.hidden = false;
      updateSound();
    }
  };
  pc.onicecandidate = (e) => {
    if (e.candidate && ws.readyState === 1) {
      ws.send(JSON.stringify({ type: 'ice', candidate: e.candidate.candidate,
                               sdpMLineIndex: e.candidate.sdpMLineIndex ?? 0 }));
    }
  };
  pc.oniceconnectionstatechange = () => log(`ICE ${pc.iceConnectionState}`);
  pc.onicegatheringstatechange = () => log(`coleta ICE ${pc.iceGatheringState}`);
  pc.onconnectionstatechange = () => {
    log(`conexão ${pc.connectionState}`);
    if (pc.connectionState === 'connected') {
      clearTimeout(timer);
      // Só agora larga a conexão anterior: a última imagem fica na tela até aqui.
      // Vídeo e áudio chegam em eventos separados; o elemento recebe as duas trilhas.
      video.srcObject = new MediaStream(pc.getReceivers().map((r) => r.track));
      // Com som, se o navegador deixar (o clique em "Assistir" costuma bastar).
      video.play().catch(() => { video.muted = true; video.play().catch(() => {}); updateSound(); });
      video.onplaying = () => log(`reproduzindo ${video.videoWidth}x${video.videoHeight}`);
      // Confirma que as trilhas recebem dados (ajuda a diagnosticar "sem som").
      setTimeout(async () => {
        const got = [];
        (await pc.getStats()).forEach((r) => {
          if (r.type === 'inbound-rtp') got.push(`${r.kind} ${r.packetsReceived} pacotes`);
        });
        log(`recebendo: ${got.join(' · ') || 'nada'}`);
      }, 3000);
      activePc = pc;
      if (prevPc) prevPc.close();
      setStatus('');
    }
    if (pc.connectionState === 'failed') retry(remote
      ? 'Falha na conexão de vídeo (a rede de alguma das pontas bloqueia conexões diretas). Tentando de novo…'
      : 'Falha na conexão de vídeo (verifique o Tailscale). Tentando de novo…', 3000);
  };

  ws.onmessage = async (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'offer') {
      try {
        await pc.setRemoteDescription({ type: 'offer', sdp: msg.sdp });
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        ws.send(JSON.stringify({ type: 'answer', sdp: answer.sdp }));
        // Porta 0 numa linha m= = o navegador recusou aquela trilha (ex.: codec).
        const media = answer.sdp.split(/\r?\n/).filter((l) => l.startsWith('m='));
        log(`${navigator.userAgent} · resposta: ${media.join(' | ')}`);
      } catch (err) {
        log(`erro na negociação: ${err.name}: ${err.message}`);
        setStatus(`Erro na negociação do vídeo: ${err.message}`);
      }
    } else if (msg.type === 'ice') {
      try { await pc.addIceCandidate({ candidate: msg.candidate, sdpMLineIndex: msg.sdpMLineIndex }); } catch {}
    } else if (msg.type === 'full') {
      retry('A transmissão está cheia. Tentando de novo em instantes…', 5000);
    } else if (msg.type === 'kicked') {
      stop('Você foi removido da transmissão.', true);
    } else if (msg.type === 'blocked') {
      stop('Quem está transmitindo bloqueou você.', false);
    }
  };
  ws.onclose = () => retry('Conexão perdida. Reconectando…');
}

async function updateStats() {
  const pc = activePc;
  if (!pc || pc.connectionState !== 'connected') return;
  const report = await pc.getStats();
  let v, pair;
  report.forEach((s) => {
    if (s.type === 'inbound-rtp' && s.kind === 'video') v = s;
    if (s.type === 'candidate-pair' && s.nominated && s.state === 'succeeded') pair = s;
  });
  if (!v) return;
  const now = performance.now();
  const kbps = last ? ((v.bytesReceived - last.bytes) * 8 / (now - last.t)).toFixed(0) : '–';
  const jb = v.jitterBufferEmittedCount ? (1000 * v.jitterBufferDelay / v.jitterBufferEmittedCount).toFixed(0) : '–';
  const dec = v.framesDecoded ? (1000 * v.totalDecodeTime / v.framesDecoded).toFixed(1) : '–';
  const rtt = pair?.currentRoundTripTime != null ? (pair.currentRoundTripTime * 1000).toFixed(0) : '–';
  last = { bytes: v.bytesReceived, t: now };
  statsEl.textContent =
    `resolução   ${v.frameWidth ?? '–'}x${v.frameHeight ?? '–'} @ ${v.framesPerSecond ?? 0} fps\n` +
    `bitrate     ${kbps} kbps\n` +
    `rede (RTT)  ${rtt} ms\n` +
    `buffer      ${jb} ms\n` +
    `decodific.  ${dec} ms  ${v.decoderImplementation ?? ''}${v.powerEfficientDecoder ? ' (hardware)' : ''}\n` +
    `perdidos    ${v.packetsLost ?? 0} pacotes · ${v.framesDropped ?? 0} quadros`;
}

// O navegador só toca áudio depois de um clique; o "Assistir" já conta como um.
function updateSound() {
  soundBtn.textContent = video.muted ? 'Ativar som' : 'Silenciar';
  document.body.classList.toggle('needs-unmute', !soundBtn.hidden && video.muted);
}
function toggleSound() {
  if (soundBtn.hidden) return;
  video.muted = !video.muted;
  updateSound();
}

function toggleStats() {
  statsEl.classList.toggle('on');
  clearInterval(statsTimer);
  if (statsEl.classList.contains('on')) { last = null; updateStats(); statsTimer = setInterval(updateStats, 1000); }
}
function toggleFull() {
  document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
}

soundBtn.onclick = toggleSound;
document.getElementById('btn-stats').onclick = toggleStats;
document.getElementById('btn-full').onclick = toggleFull;
video.ondblclick = toggleFull;
document.onkeydown = (e) => {
  if (e.target instanceof HTMLInputElement) return;
  if (e.key === 's' || e.key === 'S') toggleStats();
  if (e.key === 'f' || e.key === 'F') toggleFull();
  if (e.key === 'm' || e.key === 'M') toggleSound();
};

const nameInput = document.getElementById('name');
nameInput.value = stored('telinha-name', '');
document.getElementById('join').onsubmit = (e) => {
  e.preventDefault();
  viewerName = nameInput.value.trim();
  store('telinha-name', viewerName);
  document.getElementById('join').hidden = true;
  video.muted = false;
  connect();
};
document.getElementById('rejoin').onclick = () => {
  document.getElementById('ended').hidden = true;
  video.muted = false;
  connect();
};
</script>
</body>
</html>
