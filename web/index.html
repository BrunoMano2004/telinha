<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telinha</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    font: 13px/1.4 system-ui, sans-serif; color: #e6e6e6; }
  video, canvas { width: 100vw; height: 100vh; object-fit: contain; display: block; background: #000; }
  canvas[hidden], video[hidden] { display: none; }
  #mode { padding: 6px 10px; border-radius: 6px; background: rgba(30,30,30,.85); border: 1px solid #3a3a3a;
    color: #b8b8b8; font-size: 12px; }
  #mode[hidden] { display: none; }
  #status { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none;
    font-size: 15px; color: #9a9a9a; }
  #status:empty { display: none; }
  #bar { position: fixed; top: 12px; right: 12px; display: flex; align-items: center; gap: 6px; opacity: 0;
    transition: opacity .2s; }
  body:hover #bar, body.idle-off #bar, body.needs-unmute #bar { opacity: 1; }
  #volume { width: 110px; accent-color: #6d5dfc; cursor: pointer; }
  #volume[hidden] { display: none; }
  button { background: rgba(30,30,30,.85); color: #e6e6e6; border: 1px solid #3a3a3a;
    border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer; }
  button:hover { background: rgba(60,60,60,.9); }
  #stats { position: fixed; top: 12px; left: 12px; background: rgba(0,0,0,.7);
    border: 1px solid #333; border-radius: 6px; padding: 8px 10px; white-space: pre;
    font: 12px/1.5 ui-monospace, monospace; display: none; }
  #stats.on { display: block; }
  .overlay { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px;
    background: rgba(0,0,0,.82); }
  .overlay[hidden] { display: none; }
  .card { width: min(360px, 100%); box-sizing: border-box; background: #161616; border: 1px solid #2c2c2c;
    border-radius: 14px; padding: 22px; display: grid; gap: 12px; text-align: center; }
  .card img { width: 56px; height: 56px; margin: 0 auto; }
  .card h1 { margin: 0; font-size: 18px; font-weight: 600; }
  .card p { margin: 0; color: #a8a8a8; font-size: 14px; }
  .card input { box-sizing: border-box; width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid #3a3a3a; background: #0d0d0d; color: #eee; font: 15px system-ui, sans-serif; }
  .card input:focus { outline: 2px solid #6d5dfc; border-color: transparent; }
  .card button { padding: 10px; font-size: 15px; background: #6d5dfc; border: 0; color: #fff; }
  .card button:hover { background: #5a4ae6; }
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<!-- Modo túnel: o vídeo é decodificado com WebCodecs e desenhado aqui. -->
<canvas id="canvas" hidden></canvas>
<div id="status"></div>
<pre id="stats"></pre>
<form id="join" class="overlay">
  <div class="card">
    <img src="/favicon.svg" alt="">
    <h1>Telinha</h1>
    <p>Como você quer aparecer para quem está transmitindo?</p>
    <input id="name" maxlength="40" placeholder="Seu nome" autocomplete="nickname" autofocus>
    <button type="submit">Assistir</button>
  </div>
</form>
<div id="ended" class="overlay" hidden>
  <div class="card">
    <img src="/favicon.svg" alt="">
    <p id="ended-text"></p>
    <button id="rejoin" type="button">Entrar de novo</button>
  </div>
</div>
<div id="bar">
  <span id="mode" hidden title="A conexão direta não fechou nesta rede; o vídeo vem pela Cloudflare, com um pouco mais de atraso">pelo túnel</span>
  <button id="btn-sound" title="Som (M)" hidden>Ativar som</button>
  <input id="volume" type="range" min="0" max="1" step="0.05" title="Volume (↑/↓)" aria-label="Volume" hidden>
  <button id="btn-stats" title="Estatísticas (S)">Estatísticas</button>
  <button id="btn-full" title="Tela cheia (F ou duplo clique)">Tela cheia</button>
</div>
<script>
const video = document.getElementById('video');
const statusEl = document.getElementById('status');
const statsEl = document.getElementById('stats');
const soundBtn = document.getElementById('btn-sound');
const volumeEl = document.getElementById('volume');
// Conexão que está mostrando vídeo agora (a nova só a substitui ao conectar).
let activePc, statsTimer, last;

function setStatus(text) { statusEl.textContent = text; }

// localStorage pode não existir (janela anônima, armazenamento bloqueado).
function stored(key, fallback) {
  try { return localStorage.getItem(key) ?? fallback; } catch { return fallback; }
}
function store(key, value) {
  try { localStorage.setItem(key, value); } catch {}
}
// Id aleatório deste navegador: permite que quem transmite bloqueie alguém.
const clientId = (() => {
  let id = stored('telinha-client', '');
  if (!id) {
    id = (crypto.randomUUID?.() ?? Math.random().toString(36).slice(2) + Date.now().toString(36));
    store('telinha-client', id);
  }
  return id;
})();
// O navegador não revela o nome do computador; mostramos navegador · sistema.
function deviceName() {
  const ua = navigator.userAgent;
  const browser = /Edg\//.test(ua) ? 'Edge' : /OPR\//.test(ua) ? 'Opera' : /Firefox\//.test(ua) ? 'Firefox'
    : /Chrome\//.test(ua) ? 'Chrome' : /Safari\//.test(ua) ? 'Safari' : 'Navegador';
  const os = /Android/.test(ua) ? 'Android' : /iPhone|iPad/.test(ua) ? 'iOS' : /Windows/.test(ua) ? 'Windows'
    : /Mac OS X/.test(ua) ? 'macOS' : /CrOS/.test(ua) ? 'ChromeOS' : /Linux/.test(ua) ? 'Linux' : '';
  return os ? `${browser} · ${os}` : browser;
}
let viewerName = '';

// Expulso ou bloqueado: para de reconectar e mostra o aviso.
function ended(text, canRejoin) {
  if (activePc) { activePc.close(); activePc = null; }
  if (tunnel) tunnel.close();
  video.srcObject = null;
  setStatus('');
  document.getElementById('ended-text').textContent = text;
  document.getElementById('rejoin').hidden = !canRejoin;
  document.getElementById('ended').hidden = false;
}

// Tempo máximo para uma tentativa chegar ao vídeo; depois disso, recomeça do zero.
const CONNECT_TIMEOUT_MS = 20000;
// Tentativas seguidas sem vídeo; a partir de 2, explica o que está acontecendo.
let failedAttempts = 0;
const BLOCKED_TEXT = 'Não foi possível ligar o vídeo direto entre você e quem transmite: a rede de um ' +
  'dos lados (roteador, firewall ou operadora) bloqueia esse tipo de conexão. Tentando de novo… ' +
  'Se continuar, tente outra rede (por exemplo, o 4G/5G do celular).';

// Resumo dos candidatos ICE de uma linha SDP "candidate:": tipo e família do endereço.
function candidateKind(line) {
  const parts = line.split(' ');
  const address = parts[4] || '';
  const type = parts[parts.indexOf('typ') + 1] || '?';
  const family = address.endsWith('.local') ? 'mDNS' : address.includes(':') ? 'IPv6' : 'IPv4';
  return `${type}/${family}`;
}

function connect() {
  if (tunnelMode) return connectTunnel();
  // Variáveis locais: handlers de uma tentativa antiga nunca mexem na nova.
  const prevPc = activePc;
  let done = false;
  // HTTPS = aberto pelo túnel da Cloudflare, de fora da tailnet: precisa de STUN
  // para o vídeo achar um caminho até a máquina que transmite.
  const remote = location.protocol === 'https:';
  const ws = new WebSocket(`${remote ? 'wss' : 'ws'}://${location.host}/ws${location.search}`);
  const pc = new RTCPeerConnection({
    bundlePolicy: 'max-bundle',
    iceServers: remote ? [{ urls: 'stun:stun.l.google.com:19302' }] : [],
  });
  if (!prevPc) setStatus(failedAttempts >= 2 ? BLOCKED_TEXT : 'Conectando…');
  const kinds = { local: {}, remote: {} };
  const count = (side, line) => { const k = candidateKind(line); kinds[side][k] = (kinds[side][k] || 0) + 1; };
  const summary = (side) => Object.entries(kinds[side]).map(([k, n]) => `${k}×${n}`).join(' ') || 'nenhum';
  ws.onopen = () => ws.send(JSON.stringify({ type: 'hello', name: viewerName, device: deviceName(), client: clientId }));
  // Fim definitivo (sem nova tentativa).
  const stop = (text, canRejoin) => {
    done = true;
    clearTimeout(timer);
    ws.onclose = null;
    try { ws.close(); } catch {}
    pc.close();
    ended(text, canRejoin);
  };
  // Diagnóstico: o que acontece no navegador aparece no terminal de quem transmite.
  const log = (text) => {
    if (ws.readyState === 1) ws.send(JSON.stringify({ type: 'log', text: String(text).slice(0, 500) }));
  };

  // Encerra esta tentativa (uma vez só) e agenda a próxima.
  const retry = (text, delay = 2000) => {
    if (done) return;
    done = true;
    clearTimeout(timer);
    // Antes de fechar o WebSocket, que é por onde o diagnóstico chega a quem transmite.
    if (pc !== activePc) log(`sem vídeo nesta tentativa · ICE ${pc.iceConnectionState} · caminhos daqui: ${summary('local')} · de lá: ${summary('remote')}`);
    ws.onclose = null;
    try { ws.close(); } catch {}
    // A conexão em uso fica aberta: mantém a última imagem até a próxima conectar.
    if (pc !== activePc) {
      pc.close();
      failedAttempts++;
    }
    // Duas tentativas diretas sem vídeo: passa a receber pelo túnel da Cloudflare.
    if (failedAttempts >= 2 && !activePc && remote && tunnelSupported()) {
      tunnelMode = true;
      setTimeout(connectTunnel, 0);
      return;
    }
    setStatus(failedAttempts >= 2 && !activePc ? BLOCKED_TEXT : text);
    setTimeout(connect, delay);
  };
  const timer = setTimeout(() => retry('Reconectando…', 0), CONNECT_TIMEOUT_MS);

  pc.ontrack = (e) => {
    // Pede ao navegador o menor buffer de reprodução possível.
    try { e.receiver.jitterBufferTarget = 0; } catch {}
    try { e.receiver.playoutDelayHint = 0; } catch {}
    if (e.track.kind === 'audio') {
      soundBtn.hidden = false;
      volumeEl.hidden = false;
      updateSound();
    }
  };
  pc.onicecandidate = (e) => {
    if (e.candidate?.candidate) count('local', e.candidate.candidate);
    if (e.candidate && ws.readyState === 1) {
      ws.send(JSON.stringify({ type: 'ice', candidate: e.candidate.candidate,
                               sdpMLineIndex: e.candidate.sdpMLineIndex ?? 0 }));
    }
  };
  pc.oniceconnectionstatechange = () => log(`ICE ${pc.iceConnectionState}`);
  pc.onicegatheringstatechange = () => {
    log(`coleta ICE ${pc.iceGatheringState}${pc.iceGatheringState === 'complete' ? ` · caminhos daqui: ${summary('local')}` : ''}`);
  };
  pc.onconnectionstatechange = () => {
    log(`conexão ${pc.connectionState}`);
    if (pc.connectionState === 'connected') {
      clearTimeout(timer);
      failedAttempts = 0;
      // Qual caminho funcionou (direto, via NAT, IPv4/IPv6): ajuda a entender redes difíceis.
      pc.getStats().then((report) => {
        let pair;
        report.forEach((r) => { if (r.type === 'candidate-pair' && r.nominated && r.state === 'succeeded') pair = r; });
        const side = (id) => { const c = id && report.get(id); return c ? `${c.candidateType}/${(c.address || c.ip || '').includes(':') ? 'IPv6' : 'IPv4'}` : '?'; };
        if (pair) log(`caminho em uso: daqui ${side(pair.localCandidateId)} → lá ${side(pair.remoteCandidateId)}`);
      }).catch(() => {});
      // Só agora larga a conexão anterior: a última imagem fica na tela até aqui.
      // Vídeo e áudio chegam em eventos separados; o elemento recebe as duas trilhas.
      video.srcObject = new MediaStream(pc.getReceivers().map((r) => r.track));
      // Com som, se o navegador deixar (o clique em "Assistir" costuma bastar).
      video.play().catch(() => { video.muted = true; video.play().catch(() => {}); updateSound(); });
      video.onplaying = () => log(`reproduzindo ${video.videoWidth}x${video.videoHeight}`);
      // Confirma que as trilhas recebem dados (ajuda a diagnosticar "sem som").
      setTimeout(async () => {
        const got = [];
        (await pc.getStats()).forEach((r) => {
          if (r.type === 'inbound-rtp') got.push(`${r.kind} ${r.packetsReceived} pacotes`);
        });
        log(`recebendo: ${got.join(' · ') || 'nada'}`);
      }, 3000);
      activePc = pc;
      if (prevPc) prevPc.close();
      setStatus('');
    }
    if (pc.connectionState === 'failed') retry(remote
      ? 'Falha na conexão de vídeo (a rede de alguma das pontas bloqueia conexões diretas). Tentando de novo…'
      : 'Falha na conexão de vídeo (verifique o Tailscale). Tentando de novo…', 3000);
  };

  ws.onmessage = async (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'offer') {
      try {
        await pc.setRemoteDescription({ type: 'offer', sdp: msg.sdp });
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        ws.send(JSON.stringify({ type: 'answer', sdp: answer.sdp }));
        // Porta 0 numa linha m= = o navegador recusou aquela trilha (ex.: codec).
        const media = answer.sdp.split(/\r?\n/).filter((l) => l.startsWith('m='));
        log(`${navigator.userAgent} · resposta: ${media.join(' | ')}`);
      } catch (err) {
        log(`erro na negociação: ${err.name}: ${err.message}`);
        setStatus(`Erro na negociação do vídeo: ${err.message}`);
      }
    } else if (msg.type === 'ice') {
      if (msg.candidate) count('remote', msg.candidate);
      try { await pc.addIceCandidate({ candidate: msg.candidate, sdpMLineIndex: msg.sdpMLineIndex }); } catch {}
    } else if (msg.type === 'full') {
      retry('A transmissão está cheia. Tentando de novo em instantes…', 5000);
    } else if (msg.type === 'kicked') {
      stop('Você foi removido da transmissão.', true);
    } else if (msg.type === 'blocked') {
      stop('Quem está transmitindo bloqueou você.', false);
    }
  };
  ws.onclose = () => retry('Conexão perdida. Reconectando…');
}

// --- Modo túnel ---------------------------------------------------------------
// Quando a conexão direta (WebRTC) não fecha, o vídeo H.264 e o áudio Opus já
// codificados vêm pelo próprio WebSocket, que passa pela Cloudflare. Cada
// mensagem binária: [tipo][pts em µs, u64][dados]; tipo 1 = quadro-chave,
// 2 = quadro, 3 = áudio. Decodificação com WebCodecs; som pelo Web Audio.
// "?tunel" no link força o modo túnel (para redes que sabidamente bloqueiam).
let tunnelMode = new URLSearchParams(location.search).has('tunel'), tunnel = null, audioCtx = null;
const canvas = document.getElementById('canvas');
const tunnelSupported = () => 'VideoDecoder' in window && 'EncodedVideoChunk' in window;

// Tipos de NAL de um quadro Annex B (diagnóstico): 1 = fatia, 5 = IDR, 6 = SEI, 7 = SPS, 8 = PPS, 9 = AUD.
function nalTypes(data) {
  const types = [];
  for (let i = 0; i + 3 < data.length && types.length < 8; i++) {
    if (data[i] === 0 && data[i + 1] === 0 && (data[i + 2] === 1 || (data[i + 2] === 0 && data[i + 3] === 1))) {
      const at = data[i + 2] === 1 ? i + 3 : i + 4;
      types.push(data[at] & 0x1f);
      i = at;
    }
  }
  return types;
}

// Limpa um quadro Annex B: tira o delimitador (AUD) e mantém só a primeira
// cópia de SPS/PPS (o encoder e o h264parse podem repetir; o Firefox recusa).
function cleanAccessUnit(data) {
  const units = [];
  let start = -1;
  for (let i = 0; i + 2 < data.length; i++) {
    if (data[i] === 0 && data[i + 1] === 0 && data[i + 2] === 1) {
      if (start >= 0) units.push(data.subarray(start, i > 0 && data[i - 1] === 0 ? i - 1 : i));
      start = i + 3;
      i += 2;
    }
  }
  if (start >= 0) units.push(data.subarray(start));
  const seen = new Set();
  const kept = units.filter((u) => {
    const type = u[0] & 0x1f;
    if (type === 9) return false;
    if (type === 7 || type === 8) {
      if (seen.has(type)) return false;
      seen.add(type);
    }
    return u.length > 0;
  });
  const out = new Uint8Array(kept.reduce((n, u) => n + 4 + u.length, 0));
  let at = 0;
  for (const u of kept) { out.set([0, 0, 0, 1], at); out.set(u, at + 4); at += 4 + u.length; }
  return out;
}

async function pickVideoCodec() {
  const forced = new URLSearchParams(location.search).get('codec');
  if (forced) return forced;
  // H.264 constrained baseline; o nível só limita a resolução declarada.
  for (const codec of ['avc1.42E034', 'avc1.42E02A', 'avc1.42E01F']) {
    try {
      if ((await VideoDecoder.isConfigSupported({ codec, optimizeForLatency: true })).supported) return codec;
    } catch {}
  }
  return null;
}

function connectTunnel() {
  const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws${location.search}`);
  ws.binaryType = 'arraybuffer';
  const ctx2d = canvas.getContext('2d');
  const log = (text) => {
    if (ws.readyState === 1) ws.send(JSON.stringify({ type: 'log', text: String(text).slice(0, 500) }));
  };
  const state = { ws, closed: false, decoder: null, audio: null, playhead: 0, waitingKey: true, shown: false,
    frames: 0, bytes: 0, skipped: 0, codec: '' };
  tunnel = state;
  let stopped = false;
  state.close = () => {
    state.closed = true;
    ws.onclose = null;
    try { ws.close(); } catch {}
    try { state.decoder?.close(); } catch {}
    try { state.audio?.close(); } catch {}
  };
  const stop = (text, canRejoin) => { stopped = true; state.close(); ended(text, canRejoin); };
  if (!state.shown) setStatus('Conectando pelo túnel…');
  document.getElementById('mode').hidden = false;

  const newDecoder = () => new VideoDecoder({
    output: (frame) => {
      if (canvas.width !== frame.displayWidth || canvas.height !== frame.displayHeight) {
        canvas.width = frame.displayWidth;
        canvas.height = frame.displayHeight;
      }
      ctx2d.drawImage(frame, 0, 0);
      frame.close();
      state.frames++;
      if (!state.shown) {
        state.shown = true;
        video.hidden = true;
        canvas.hidden = false;
        setStatus('');
        log(`reproduzindo pelo túnel ${canvas.width}x${canvas.height} (${state.codec})`);
      }
    },
    error: (err) => {
      log(`erro no decodificador (quadro ${state.chunks}, ${state.lastKind}, NALs ${state.lastNals}): ${err.message}`);
      state.waitingKey = true;
      state.decoder = null;
    },
  });

  const onVideo = (key, ts, data) => {
    if (!state.decoder || state.decoder.state === 'closed') {
      if (!state.codec) return;
      state.decoder = newDecoder();
      state.decoder.configure({ codec: state.codec, optimizeForLatency: true });
      state.waitingKey = true;
    }
    // Computador sem fôlego para decodificar: pula até o próximo quadro-chave.
    if (state.decoder.decodeQueueSize > 8) state.waitingKey = true;
    if (state.waitingKey && !key) {
      state.skipped++;
      // O telinha só gera quadro-chave quando alguém pede: pede (no máximo 1/s).
      const now = performance.now();
      if (!state.lastKeyRequest || now - state.lastKeyRequest > 1000) {
        state.lastKeyRequest = now;
        if (ws.readyState === 1) ws.send(JSON.stringify({ type: 'keyframe' }));
      }
      return;
    }
    data = cleanAccessUnit(data);
    state.waitingKey = false;
    state.chunks = (state.chunks || 0) + 1;
    state.lastKind = key ? 'chave' : 'delta';
    state.lastNals = nalTypes(data).join(',');
    state.decoder.decode(new EncodedVideoChunk({ type: key ? 'key' : 'delta', timestamp: ts, data }));
  };

  const onAudio = (ts, data) => {
    if (!audioCtx || !('AudioDecoder' in window)) return;
    if (!state.audio) {
      const gain = audioCtx.createGain();
      gain.connect(audioCtx.destination);
      state.gain = gain;
      state.audio = new AudioDecoder({
        output: (audioData) => {
          const buffer = audioCtx.createBuffer(audioData.numberOfChannels, audioData.numberOfFrames, audioData.sampleRate);
          for (let ch = 0; ch < audioData.numberOfChannels; ch++) {
            const plane = new Float32Array(audioData.numberOfFrames);
            audioData.copyTo(plane, { planeIndex: ch, format: 'f32-planar' });
            buffer.copyToChannel(plane, ch);
          }
          audioData.close();
          // Pequena reserva (80 ms) contra engasgos; se acumular atraso, recomeça.
          const now = audioCtx.currentTime;
          if (state.playhead < now + 0.02 || state.playhead > now + 0.4) state.playhead = now + 0.08;
          const source = audioCtx.createBufferSource();
          source.buffer = buffer;
          source.connect(state.gain);
          source.start(state.playhead);
          state.playhead += buffer.duration;
        },
        error: (err) => { log(`erro no áudio: ${err.message}`); state.audio = null; },
      });
      state.audio.configure({ codec: 'opus', sampleRate: 48000, numberOfChannels: 2 });
      soundBtn.hidden = false;
      volumeEl.hidden = false;
      applyTunnelVolume();
      updateSound();
    }
    if (state.audio.state === 'configured') state.audio.decode(new EncodedAudioChunk({ type: 'key', timestamp: ts, data }));
  };

  ws.onopen = () => ws.send(JSON.stringify({ type: 'hello', name: viewerName, device: deviceName(), client: clientId, mode: 'tunnel' }));
  ws.onmessage = async (e) => {
    if (typeof e.data === 'string') {
      const msg = JSON.parse(e.data);
      if (msg.type === 'tunnel') {
        state.codec = await pickVideoCodec();
        log(`modo túnel · ${navigator.userAgent} · codec ${state.codec || 'nenhum H.264 suportado'}`);
        if (!state.codec) setStatus('Este navegador não decodifica H.264 pelo WebCodecs. Tente o Chrome, o Edge ou o Firefox atualizado.');
      } else if (msg.type === 'full') {
        setStatus('A transmissão está cheia. Tentando de novo em instantes…');
      } else if (msg.type === 'kicked') {
        stop('Você foi removido da transmissão.', true);
      } else if (msg.type === 'blocked') {
        stop('Quem está transmitindo bloqueou você.', false);
      }
      return;
    }
    const view = new DataView(e.data);
    const kind = view.getUint8(0);
    const ts = Number(view.getBigUint64(1));
    const data = new Uint8Array(e.data, 9);
    state.bytes += e.data.byteLength;
    if (kind === 3) onAudio(ts, data);
    else onVideo(kind === 1, ts, data);
  };
  ws.onclose = () => {
    state.close();
    if (stopped) return;
    if (!state.shown) setStatus('Conexão pelo túnel perdida. Reconectando…');
    setTimeout(connectTunnel, 2000);
  };
}

// No túnel o som sai pelo Web Audio; o <video> (escondido) continua sendo a
// referência de volume e mudo, então os mesmos controles servem.
function applyTunnelVolume() {
  if (tunnel?.gain) tunnel.gain.gain.value = video.muted ? 0 : video.volume;
}
video.addEventListener('volumechange', applyTunnelVolume);

function tunnelStats() {
  const now = performance.now();
  const t = tunnel;
  const kbps = last ? ((t.bytes - last.bytes) * 8 / (now - last.t)).toFixed(0) : '–';
  const fps = last?.frames !== undefined ? ((t.frames - last.frames) * 1000 / (now - last.t)).toFixed(0) : '–';
  last = { bytes: t.bytes, frames: t.frames, t: now };
  statsEl.textContent =
    `modo        túnel (pela Cloudflare)\n` +
    `resolução   ${canvas.width}x${canvas.height} @ ${fps} fps\n` +
    `bitrate     ${kbps} kbps\n` +
    `decodific.  ${t.codec || '–'} · fila ${t.decoder?.decodeQueueSize ?? 0}\n` +
    `pulados     ${t.skipped} quadros`;
}

async function updateStats() {
  if (tunnel && !tunnel.closed) return tunnelStats();
  const pc = activePc;
  if (!pc || pc.connectionState !== 'connected') return;
  const report = await pc.getStats();
  let v, pair;
  report.forEach((s) => {
    if (s.type === 'inbound-rtp' && s.kind === 'video') v = s;
    if (s.type === 'candidate-pair' && s.nominated && s.state === 'succeeded') pair = s;
  });
  if (!v) return;
  const now = performance.now();
  const kbps = last ? ((v.bytesReceived - last.bytes) * 8 / (now - last.t)).toFixed(0) : '–';
  const jb = v.jitterBufferEmittedCount ? (1000 * v.jitterBufferDelay / v.jitterBufferEmittedCount).toFixed(0) : '–';
  const dec = v.framesDecoded ? (1000 * v.totalDecodeTime / v.framesDecoded).toFixed(1) : '–';
  const rtt = pair?.currentRoundTripTime != null ? (pair.currentRoundTripTime * 1000).toFixed(0) : '–';
  last = { bytes: v.bytesReceived, t: now };
  statsEl.textContent =
    `resolução   ${v.frameWidth ?? '–'}x${v.frameHeight ?? '–'} @ ${v.framesPerSecond ?? 0} fps\n` +
    `bitrate     ${kbps} kbps\n` +
    `rede (RTT)  ${rtt} ms\n` +
    `buffer      ${jb} ms\n` +
    `decodific.  ${dec} ms  ${v.decoderImplementation ?? ''}${v.powerEfficientDecoder ? ' (hardware)' : ''}\n` +
    `perdidos    ${v.packetsLost ?? 0} pacotes · ${v.framesDropped ?? 0} quadros`;
}

// O navegador só toca áudio depois de um clique; o "Assistir" já conta como um.
function updateSound() {
  soundBtn.textContent = video.muted ? 'Ativar som' : 'Silenciar';
  volumeEl.value = video.muted ? 0 : video.volume;
  volumeEl.title = `Volume ${video.muted ? 0 : Math.round(video.volume * 100)}% (↑/↓)`;
  document.body.classList.toggle('needs-unmute', !soundBtn.hidden && video.muted);
}
function toggleSound() {
  if (soundBtn.hidden) return;
  video.muted = !video.muted;
  // Voltar do mudo com o volume no zero não faria som nenhum.
  if (!video.muted && video.volume === 0) {
    video.volume = 0.5;
    store('telinha-volume', '0.5');
  }
  updateSound();
}
// Volume de 0 a 1, lembrado neste navegador; zero equivale a mudo.
function setVolume(value) {
  const v = Math.min(1, Math.max(0, Math.round(value * 100) / 100));
  video.volume = v;
  video.muted = v === 0;
  store('telinha-volume', String(v));
  updateSound();
}
// Um volume salvo em zero não volta: a página abriria sem som e sem o botão de ativar.
video.volume = Math.min(1, Number(stored('telinha-volume', '1')) || 1);
volumeEl.oninput = () => setVolume(Number(volumeEl.value));

function toggleStats() {
  statsEl.classList.toggle('on');
  clearInterval(statsTimer);
  if (statsEl.classList.contains('on')) { last = null; updateStats(); statsTimer = setInterval(updateStats, 1000); }
}
function toggleFull() {
  document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
}

soundBtn.onclick = toggleSound;
document.getElementById('btn-stats').onclick = toggleStats;
document.getElementById('btn-full').onclick = toggleFull;
video.ondblclick = toggleFull;
canvas.ondblclick = toggleFull;
document.onkeydown = (e) => {
  // No campo de nome as teclas são texto; no controle de volume as setas já são dele.
  if (e.target instanceof HTMLInputElement && e.target.type !== 'range') return;
  if ((e.key === 'ArrowUp' || e.key === 'ArrowDown') && e.target !== volumeEl && !soundBtn.hidden) {
    e.preventDefault();
    setVolume((video.muted ? 0 : video.volume) + (e.key === 'ArrowUp' ? 0.1 : -0.1));
  }
  if (e.key === 's' || e.key === 'S') toggleStats();
  if (e.key === 'f' || e.key === 'F') toggleFull();
  if (e.key === 'm' || e.key === 'M') toggleSound();
};

const nameInput = document.getElementById('name');
nameInput.value = stored('telinha-name', '');
document.getElementById('join').onsubmit = (e) => {
  e.preventDefault();
  viewerName = nameInput.value.trim();
  store('telinha-name', viewerName);
  document.getElementById('join').hidden = true;
  video.muted = false;
  // Criado no clique: o navegador só deixa tocar som depois de um gesto (modo túnel).
  try { audioCtx = new AudioContext({ latencyHint: 'interactive' }); } catch {}
  connect();
};
document.getElementById('rejoin').onclick = () => {
  document.getElementById('ended').hidden = true;
  video.muted = false;
  audioCtx?.resume();
  connect();
};
</script>
</body>
</html>
